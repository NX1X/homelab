services:
  gitlab:
    image: gitlab/gitlab-ce:19.1.0-ce.0
    container_name: gitlab-ce
    hostname: gitlab.example.lan
    restart: unless-stopped
    ports:
      - "443:443"
      - "2222:22"        # Git SSH (host keeps port 22 for management)
      - "5050:5050"      # Container registry
    volumes:
      - /data/gitlab/config:/etc/gitlab
      - /data/gitlab/logs:/var/log/gitlab
      - /data/gitlab/data:/var/opt/gitlab
    shm_size: '256m'
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 6G
    healthcheck:
      test: ["CMD", "curl", "-fsk", "https://localhost/-/health"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 300s
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        ## External URL
        external_url 'https://gitlab.example.lan'

        ## SSH
        gitlab_rails['gitlab_shell_ssh_port'] = 2222

        ## Container Registry
        registry_external_url 'https://gitlab.example.lan:5050'
        registry['enable'] = true
        registry_nginx['ssl_certificate'] = "/etc/gitlab/ssl/gitlab.example.lan.crt"
        registry_nginx['ssl_certificate_key'] = "/etc/gitlab/ssl/gitlab.example.lan.key"

        ## Memory optimization (suitable for a small instance / solo user)
        puma['worker_processes'] = 2
        puma['min_threads'] = 1
        puma['max_threads'] = 4
        sidekiq['max_concurrency'] = 5
        sidekiq['min_concurrency'] = 1

        ## Disable Prometheus (saves ~200MB RAM)
        prometheus_monitoring['enable'] = false

        ## Disable unused features to save memory
        gitlab_kas['enable'] = false

        ## Timezone
        gitlab_rails['time_zone'] = 'UTC'

        ## Backup retention (7 days)
        gitlab_rails['backup_keep_time'] = 604800

        ## NGINX — HTTPS only (no HTTP listener)
        nginx['listen_port'] = 443
        nginx['listen_https'] = true
        nginx['redirect_http_to_https'] = false
        nginx['hsts_max_age'] = 31536000
        letsencrypt['enable'] = false
