services:
  gitlab-runner:
    image: gitlab/gitlab-runner:v19.1.0
    container_name: gitlab-runner
    restart: unless-stopped
    volumes:
      - /data/gitlab-runner/config:/etc/gitlab-runner
      - /data/gitlab-runner/certs:/etc/gitlab-runner/certs:ro
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    healthcheck:
      test: ["CMD", "gitlab-runner", "verify"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
